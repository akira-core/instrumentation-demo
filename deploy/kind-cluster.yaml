# Single-node kind cluster for the trace-propagation demo. Access to
# in-cluster services (frontend, Grafana) is via `kubectl port-forward`
# (see README.md), so no extraPortMappings/Ingress are needed.
#
# Cluster name is omitted here — Makefile passes --name (default demo-trace).
# If a cluster of that name already exists, create is skipped.
#
# Create:   kind create cluster --name demo-trace --config deploy/kind-cluster.yaml
# Teardown: kind delete cluster --name demo-trace
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
