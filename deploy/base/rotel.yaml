# rotel (https://github.com/streamfold/rotel) — lightweight Rust OTel collector.
# No official Helm chart exists for rotel, so this is a plain Deployment+Service
# (+ a one-shot schema-init Job), per tasks.md 6.1.
#
# Image: docker.io/streamfold/rotel:v0.2.2 — confirmed to exist and pull
# successfully (`docker pull streamfold/rotel:v0.2.2`) as of writing. v0.2.2 is
# the latest tagged GitHub release (github.com/streamfold/rotel releases) at
# time of writing.
#
# ClickHouse connection: rotel's ClickHouse exporter (src/exporters/clickhouse)
# is HTTP-only (uses ClickHouse's HTTP interface, e.g. "http://host:8123"; there
# is no native-protocol/9000 support in this exporter) — confirmed by reading
# rotel's exporter source. Host "clickhouse" is the Helm release name installed
# via `helm install clickhouse charts/clickhouse -f deploy/values/clickhouse.yaml -n demo`
# (see deploy/values/clickhouse.yaml), which creates a Service named "clickhouse"
# exposing port 8123 (HTTP) among others.
#
# Credentials: MUST match deploy/values/clickhouse.yaml's `auth.username` /
# `auth.password` literally (username "default", password "demo-clickhouse-pw" —
# a plaintext demo credential, intentional for an ephemeral local `kind` cluster).
# Stored here as a Secret so it isn't duplicated as a raw literal in multiple
# places in this file.
#
# IMPORTANT DEVIATION from tasks.md 6.1/6.2 ("do not hand-write a ClickHouse DDL
# — let rotel create it" / "allowing rotel to create its default OTLP trace
# schema"): rotel's ClickHouse exporter does NOT auto-create its table schema.
# Its own README states: "The exporter will not generate the table schema if it
# does not exist. Use the clickhouse-ddl command for generating the necessary
# table DDL for ClickHouse." (confirmed by reading rotel's source at
# src/exporters/clickhouse/mod.rs and src/bin/clickhouse-ddl/README.md). There is
# no autoDDL/autoMigrate flag. To honor the *intent* ("no hand-written DDL") while
# working around this factual gap, the Job below runs rotel's own bundled
# `clickhouse-ddl` tool (docker.io/streamfold/rotel-clickhouse-ddl:v0.2.2, same
# release, same repo) to generate *and execute* the exact DDL rotel's schema
# expects — nobody hand-wrote a CREATE TABLE statement. This creates:
#   - otel.otel_traces               (the main span table rotel's exporter writes to)
#   - otel.otel_traces_trace_id_ts    (+ a materialized view) for fast by-trace-ID lookups,
#     which the Grafana ClickHouse datasource plugin's trace mode also expects
#     (see deploy/values/grafana.yaml's `traceTimestampTableSuffix: _trace_id_ts`).
# Column names (PascalCase: TraceId, SpanId, SpanName, ServiceName, Duration in
# nanoseconds, etc.) were read directly from rotel's
# src/bin/clickhouse-ddl/ddl_traces.rs and src/exporters/clickhouse/schema.rs.
# The whole schema-init Job was verified against a real cluster (ClickHouse
# also needed its `otel` database created first — clickhouse-ddl only creates
# tables inside an already-existing database, hence the extra `create-database`
# initContainer below), and a real span was pushed through rotel's OTLP/HTTP
# receiver end-to-end into `otel.otel_traces` to confirm the pipeline works.
#
# NOTE: this manifest deliberately does NOT set `ROTEL_OTEL_RESOURCE_ATTRIBUTES`
# / `--otel-resource-attributes`. It looks tempting to use it to tag rotel's own
# `service.name=rotel`, but live testing showed this flag overwrites the
# `ServiceName` column for every span passing *through* rotel (frontend,
# backend, relay-proxy spans included), not just rotel's own internal
# telemetry — it would collapse every span in the dashboard down to
# ServiceName="rotel", destroying the "originating component" column the
# observability-stack spec requires. The Service object being named "rotel"
# (below) is what satisfies the "service name 'rotel'" part of the contract —
# that's the DNS name frontend/backend's OTEL_EXPORTER_OTLP_ENDPOINT resolves.
#
# Readiness/liveness: rotel has no HTTP health-check endpoint (confirmed via
# `docker run streamfold/rotel:v0.2.2 --help` — no such flag exists). Probes below
# use tcpSocket against the OTLP/HTTP port (4318) as the best available signal
# that rotel is up and accepting connections, so the Service doesn't route OTLP
# traffic to a not-yet-listening Pod. See report for how frontend/backend are
# expected to tolerate rotel not being ready yet (client-side export retry —
# nothing to configure on rotel's side for that).

apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-demo-credentials
  namespace: demo
  labels:
    app.kubernetes.io/name: clickhouse-demo-credentials
    app.kubernetes.io/part-of: demo-trace-propagation-stack
type: Opaque
stringData:
  username: default
  password: demo-clickhouse-pw

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotel
  namespace: demo
  labels:
    app.kubernetes.io/name: rotel
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: demo-trace-propagation-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rotel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotel
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/part-of: demo-trace-propagation-stack
    spec:
      containers:
        - name: rotel
          image: docker.io/streamfold/rotel:v0.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
          env:
            - name: ROTEL_OTLP_GRPC_ENDPOINT
              value: "0.0.0.0:4317"
            - name: ROTEL_OTLP_HTTP_ENDPOINT
              value: "0.0.0.0:4318"
            # Per-signal exporter routing. Two named exporters are declared as
            # "<name>:<type>" pairs, then each signal is routed to one by name.
            # Named exporters take their parameters as ROTEL_EXPORTER_<NAME>_<PARAM>
            # (e.g. ROTEL_EXPORTER_CH_ENDPOINT), which replaces the type-based
            # ROTEL_CLICKHOUSE_EXPORTER_* spelling used when a single exporter is
            # configured via ROTEL_EXPORTER.
            #
            # Verified before rollout by running the image with this exact env
            # layout: rotel starts and logs "No exporters are configured for logs"
            # — i.e. it accepted the traces and metrics routing and only logs is
            # unset. A bad exporter *type* fails the container immediately, so
            # typos there are loud; a wrong *parameter* name would not be, which
            # is why traces are re-verified end-to-end after this change rather
            # than assuming a clean startup means the trace path still works.
            - name: ROTEL_EXPORTERS
              value: "ch:clickhouse,vm:otlp"
            - name: ROTEL_EXPORTERS_TRACES
              value: "ch"
            - name: ROTEL_EXPORTERS_METRICS
              value: "vm"
            # rotel exposes no Prometheus scrape endpoint of its own, so this is
            # the only way its pipeline health (queue depth, export failures,
            # throughput) becomes observable — which is exactly what you want to
            # watch during a load test.
            #
            # BOTH variables are required: ENABLE_INTERNAL_TELEMETRY turns the
            # feature on, EXPORTERS_INTERNAL_METRICS says where it goes. Setting
            # only the routing produces no internal metrics at all, silently.
            - name: ROTEL_ENABLE_INTERNAL_TELEMETRY
              value: "true"
            - name: ROTEL_EXPORTERS_INTERNAL_METRICS
              value: "vm"

            # ---- "ch": traces -> ClickHouse (unchanged destination) ----
            - name: ROTEL_EXPORTER_CH_ENDPOINT
              value: "http://clickhouse:8123"
            - name: ROTEL_EXPORTER_CH_DATABASE
              value: "otel"
            - name: ROTEL_EXPORTER_CH_TABLE_PREFIX
              value: "otel"
            - name: ROTEL_EXPORTER_CH_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: username
            - name: ROTEL_EXPORTER_CH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: password

            # ---- "vm": metrics -> VictoriaMetrics over OTLP ----
            # VictoriaMetrics accepts protobuf OTLP at /opentelemetry/v1/metrics;
            # the OTLP exporter appends the /v1/metrics suffix, so the configured
            # endpoint is the /opentelemetry base.
            - name: ROTEL_EXPORTER_VM_ENDPOINT
              value: "http://victoria-metrics:8428/opentelemetry"
            - name: ROTEL_EXPORTER_VM_PROTOCOL
              value: "http"
          readinessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: rotel
  namespace: demo
  labels:
    app.kubernetes.io/name: rotel
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: demo-trace-propagation-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rotel
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP

---
# One-shot schema-init Job: creates ClickHouse's otel_traces (+ trace_id_ts
# lookup table/materialized view) via rotel's own clickhouse-ddl tool before
# rotel has any spans to write. Safe to (and designed to) run more than once —
# clickhouse-ddl emits `CREATE TABLE IF NOT EXISTS` / `CREATE MATERIALIZED VIEW
# IF NOT EXISTS`. The initContainer waits for ClickHouse's HTTP port to accept
# connections first so this doesn't just burn through Job backoff retries while
# the ClickHouse StatefulSet pod is still starting (dependency-ordering
# tolerance, see spec "Component startup respects dependency ordering").
apiVersion: batch/v1
kind: Job
metadata:
  name: rotel-clickhouse-schema-init
  namespace: demo
  labels:
    app.kubernetes.io/name: rotel-clickhouse-schema-init
    app.kubernetes.io/component: otel-collector
    app.kubernetes.io/part-of: demo-trace-propagation-stack
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rotel-clickhouse-schema-init
        app.kubernetes.io/component: otel-collector
        app.kubernetes.io/part-of: demo-trace-propagation-stack
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-clickhouse
          image: docker.io/curlimages/curl:8.11.0
          command:
            - /bin/sh
            - -c
            - |
              until curl -sf http://clickhouse:8123/ping; do
                echo "waiting for clickhouse http interface..."
                sleep 3
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
        # clickhouse-ddl (below) only creates tables, not the database itself
        # (confirmed by testing against a real cluster: it 404s with "Database
        # otel does not exist" if the database isn't already there) — create it
        # first via a plain HTTP DDL statement against ClickHouse's HTTP interface.
        - name: create-database
          image: docker.io/curlimages/curl:8.11.0
          command:
            - /bin/sh
            - -c
            - |
              exec curl -sf -u "${CLICKHOUSE_USER}:${CLICKHOUSE_PASSWORD}" \
                --data-binary "CREATE DATABASE IF NOT EXISTS otel" \
                http://clickhouse:8123/
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: password
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: clickhouse-ddl
          image: docker.io/streamfold/rotel-clickhouse-ddl:v0.2.2
          command:
            - /bin/sh
            - -c
            - |
              exec /clickhouse-ddl create \
                --endpoint http://clickhouse:8123 \
                --database otel \
                --table-prefix otel \
                --user "$CLICKHOUSE_USER" \
                --password "$CLICKHOUSE_PASSWORD" \
                --traces
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-demo-credentials
                  key: password
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
