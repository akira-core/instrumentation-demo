apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# In-house services + the library feature-flag ConfigMap. NATS, ClickHouse
# (+ Rotel via the altinity-operator umbrella chart), Grafana, VictoriaMetrics,
# and the GOFF relay proxy are installed separately via their vendored Helm
# charts under charts/ — see `make deploy` / README.md.
#
# Flag definitions live here (feature-flags.yaml → ConfigMap demo-feature-flags).
# The official relay-proxy chart reads them through GOFF's configmap retriever;
# Role/RoleBinding for that read ship via deploy/values/relay-proxy.yaml
# extraManifests.
resources:
  - namespace.yaml
  - feature-flags.yaml
  - backend.yaml
  - frontend.yaml
  - js-service.yaml
