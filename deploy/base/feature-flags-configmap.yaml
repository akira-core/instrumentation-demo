# Flag definitions in GO Feature Flag's own format, read live by the GOFF relay
# proxy through its Kubernetes ConfigMap retriever (deploy/values/relay-proxy.yaml).
#
# Edit live during a demo — neither the relay proxy nor the backend restarts:
#   kubectl edit configmap demo-feature-flags -n demo
#
# Two flags, demonstrating the two layers a relay proxy can drive:
#
#   otel-nats-tracing  consumed by the otelnats LIBRARY itself, with no
#                      application code involved. Flipping it to `disabled`
#                      stops NATS producer/consumer spans being emitted at all,
#                      live. Falls back to OTEL_NATS_TRACING_ENABLED when the
#                      relay has no opinion. NOTE: the backend must not pass
#                      otelnats.WithTracingEnabled(...) — that pins a connection
#                      static and no relay value can reach it.
#
#   demo-nats-flow     consumed by APPLICATION code via the OpenFeature client.
#                      Gates whether the backend runs the NATS round trip for a
#                      request (reported back as natsFlowExecuted in the API
#                      response).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-feature-flags
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-feature-flags
    app.kubernetes.io/part-of: demo-trace-propagation-stack
data:
  flags.yaml: |
    otel-nats-tracing:
      variations:
        enabled: true
        disabled: false
      defaultRule:
        variation: enabled

    demo-nats-flow:
      variations:
        enabled: true
        disabled: false
      defaultRule:
        variation: enabled
