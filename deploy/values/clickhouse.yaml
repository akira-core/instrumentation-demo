# Demo overlay for charts/clickhouse — wiring only.
#
# The chart's own values.yaml is already the minimal-HA profile that runs on a
# single-node cluster (3 Keeper + 1 shard × 2 ClickHouse replicas). This file
# only pins the names and endpoints the rest of the demo addresses:
#
#   clickhouse:8123  — Grafana + any in-cluster client
#   rotel:4317/4318  — frontend / backend / loadgen OTLP
#
# Credentials: Secret `clickhouse-default-user` (created by `make helm-install`)
# has three keys — `password` (SQL `default` / rotel), `secret` (clusterSecret),
# `reporter` (SQL reporter). Grafana's datasource password must match the
# `reporter` key (see deploy/values/grafana.yaml).
#
# Install (two steps, see Makefile helm-install):
#   helm upgrade --install clickhouse-operator charts/clickhouse \
#     -f deploy/values/clickhouse.yaml --set cluster.enabled=false -n demo
#   helm upgrade --install clickhouse charts/clickhouse \
#     -f deploy/values/clickhouse.yaml --set operator.enabled=false -n demo

cluster:
  commonLabels:
    environment: local
    app.kubernetes.io/part-of: demo-trace-propagation-stack

  clickhouse:
    # Pin the client Service name so Grafana/docs keep using host "clickhouse"
    service:
      name: clickhouse

  rotel:
    # Service/Deployment name "rotel" — matches frontend/backend/loadgen targets
    name: rotel
    # The demo stores traces only; app + rotel internal metrics go to
    # VictoriaMetrics below.
    telemetry:
      traces: true
      logs: false
      metrics: false
    internalMetrics:
      enabled: true
      endpoint: http://victoria-metrics:8428/opentelemetry
    exporter:
      # Short retention for an ephemeral demo cluster
      ttl: 24h
