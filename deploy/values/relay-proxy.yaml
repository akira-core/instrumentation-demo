# Local-demo values for the vendored GO Feature Flag relay proxy chart
# (charts/relay-proxy, see charts/relay-proxy/SOURCE.txt). Install with:
#
#   helm install relay-proxy charts/relay-proxy -f deploy/values/relay-proxy.yaml -n demo
#
# The release name MUST be "relay-proxy": the chart's fullname template collapses
# to the release name when it contains the chart name, so this is what makes the
# in-cluster Service resolve at http://relay-proxy:1031 — the endpoint otelnats
# installs its own OpenFeature provider against (see the backend manifest's
# OTEL_INSTRUMENTATION_GO_FLAGS_ENDPOINT; no backend code reads it).
#
# Flag definitions live in deploy/base/feature-flags.yaml (ConfigMap
# demo-feature-flags). The official chart has no volume-mount helpers, so the
# relay uses GOFF's Kubernetes ConfigMap retriever and the Role/RoleBinding
# below. Live edit: kubectl edit configmap demo-feature-flags -n demo.

relayproxy:
  config: |
    server:
      mode: http
      port: 1031
      # Separate monitoring port, scraped by VictoriaMetrics at relay-proxy:1032
      # (see deploy/values/victoria-metrics.yaml). Setting this also moves the
      # chart's liveness/readiness probes onto this port — see the chart README —
      # so the pod's readiness now depends on it being served correctly.
      monitoringPort: 1032

    # How often GOFF re-reads the ConfigMap via the API, in ms. Deliberately
    # short (1s) so a `kubectl edit configmap demo-feature-flags` reaches the
    # relay quickly. otelnats's provider then polls this relay every
    # OTEL_INSTRUMENTATION_GO_FLAGS_POLL_INTERVAL (2s in this demo). Budget a
    # few seconds for a flip to land (no kubelet mount hop with the API path).
    pollingInterval: 1000

    # Tolerate helm-install before k8s-apply: the flags ConfigMap is created by
    # `kubectl apply -k deploy/base`, which runs after helm in `make deploy`.
    # Once the ConfigMap exists the retriever succeeds; until then the process
    # stays up instead of CrashLooping.
    startWithRetrieverError: true

    logLevel: info

    retriever:
      kind: configmap
      namespace: demo
      configmap: demo-feature-flags
      key: flags.yaml

    # Evaluation results are logged rather than shipped anywhere — this is a
    # local demo, and no flag-analytics backend exists in the stack.
    #
    # Expect this to stay quiet for otel-nats-tracing. otelnats evaluates
    # in-process against its polled copy of the configuration and hardcodes
    # DataCollectorDisabled, so the relay never observes those evaluations at
    # all. That is deliberate: with one evaluation per instrumented operation,
    # the analytics would be a copy of the demo's traffic volume, and a full
    # collector buffer flushes synchronously on the evaluating goroutine.
    exporter:
      kind: log

replicaCount: 1

service:
  type: ClusterIP
  port: 1031

# Modest for a single-node kind cluster (the chart's default requests 500m CPU,
# which competes with ClickHouse/Grafana on one node).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true

# RBAC so the relay's ServiceAccount can read demo-feature-flags. The official
# chart supports this through extraManifests (templated); no chart fork needed.
extraManifests:
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: {{ include "relay-proxy.fullname" . }}-flags
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "relay-proxy.labels" . | nindent 8 }}
    rules:
      - apiGroups: [""]
        resources: ["configmaps"]
        resourceNames: ["demo-feature-flags"]
        verbs: ["get", "list", "watch"]
  - |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: {{ include "relay-proxy.fullname" . }}-flags
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "relay-proxy.labels" . | nindent 8 }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: {{ include "relay-proxy.fullname" . }}-flags
    subjects:
      - kind: ServiceAccount
        name: {{ include "relay-proxy.serviceAccountName" . }}
        namespace: {{ .Release.Namespace }}
