# Local-demo values for the vendored GO Feature Flag relay proxy chart
# (charts/relay-proxy, see charts/relay-proxy/SOURCE.txt). Install with:
#
#   helm install relay-proxy charts/relay-proxy -f deploy/values/relay-proxy.yaml -n demo
#
# The release name MUST be "relay-proxy": the chart's fullname template collapses
# to the release name when it contains the chart name, so this is what makes the
# in-cluster Service resolve at http://relay-proxy:1031 — the endpoint otelnats
# installs its own OpenFeature provider against (see the backend manifest's
# OTEL_INSTRUMENTATION_GO_FLAGS_ENDPOINT; no backend code reads it).
#
# Flags are NOT defined here. They live in the demo-feature-flags ConfigMap
# (deploy/base/feature-flags-configmap.yaml), volume-mounted below, and read by
# GOFF's file retriever. No ConfigMap API RBAC is required.

relayproxy:
  config: |
    server:
      mode: http
      port: 1031
      # Separate monitoring port, scraped by VictoriaMetrics at relay-proxy:1032
      # (see deploy/values/victoria-metrics.yaml). Setting this also moves the
      # chart's liveness/readiness probes onto this port — see the chart README —
      # so the pod's readiness now depends on it being served correctly.
      monitoringPort: 1032

    # How often GOFF re-reads the mounted flags file, in ms. Deliberately short
    # (1s) so a `kubectl edit configmap demo-feature-flags` reaches the relay's
    # own view quickly (after kubelet refreshes the mount). This is only the
    # first of two hops: otelnats's provider evaluates in-process and polls this
    # relay every OTEL_INSTRUMENTATION_GO_FLAGS_POLL_INTERVAL (2s in this demo),
    # so an operator sees a flip take effect within a few seconds, not instantly.
    pollingInterval: 1000

    # Start even if the mounted flags file is not readable yet, rather than
    # crash-looping. `helm install` runs before `kubectl apply -k deploy/base`
    # (which creates the ConfigMap), and the volume is optional — see
    # kind-cluster-deployment. While the retriever has nothing, evaluations
    # return the caller's default and the local ladder below the relay decides.
    startWithRetrieverError: true

    logLevel: info

    # File retriever over the volume-mounted ConfigMap (directory mount, not
    # subPath, so kubelet refreshes on ConfigMap edit). Path matches
    # extraVolumeMounts below.
    retriever:
      kind: file
      path: /flags/flags.yaml

    # Evaluation results are logged rather than shipped anywhere — this is a
    # local demo, and no flag-analytics backend exists in the stack.
    #
    # Expect this to stay quiet for otel-nats-tracing. otelnats evaluates
    # in-process against its polled copy of the configuration and hardcodes
    # DataCollectorDisabled, so the relay never observes those evaluations at
    # all. That is deliberate: with one evaluation per instrumented operation,
    # the analytics would be a copy of the demo's traffic volume, and a full
    # collector buffer flushes synchronously on the evaluating goroutine.
    exporter:
      kind: log

replicaCount: 1

service:
  type: ClusterIP
  port: 1031

# Modest for a single-node kind cluster (the chart's default requests 500m CPU,
# which competes with ClickHouse/Grafana on one node).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true

# Mount demo-feature-flags (created by deploy/base) at /flags. optional: true
# so the pod can start before k8s-apply creates the ConfigMap; GOFF then picks
# up the file once kubelet populates the mount.
extraVolumes:
  - name: demo-feature-flags
    configMap:
      name: demo-feature-flags
      optional: true
      items:
        - key: flags.yaml
          path: flags.yaml

extraVolumeMounts:
  - name: demo-feature-flags
    mountPath: /flags
    readOnly: true

# No ConfigMap API Role/RoleBinding — flags come from the mount above.
extraManifests: []
