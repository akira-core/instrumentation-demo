# Local-demo values for the vendored GO Feature Flag relay proxy chart
# (charts/relay-proxy, see charts/relay-proxy/SOURCE.txt). Install with:
#
#   helm install relay-proxy charts/relay-proxy -f deploy/values/relay-proxy.yaml -n demo
#
# The release name MUST be "relay-proxy": the chart's fullname template collapses
# to the release name when it contains the chart name, so this is what makes the
# in-cluster Service resolve at http://relay-proxy:1031 — the endpoint otelnats
# installs its own OpenFeature provider against (see the backend manifest's
# OTEL_INSTRUMENTATION_GO_FLAGS_ENDPOINT; no backend code reads it).
#
# Flags are NOT defined here either. They live one-file-per-concern under
# charts/relay-proxy/config/, which the chart turns into the `relay-proxy-flags`
# ConfigMap, mounts at /flags, and points a generated `file` retriever at. No
# ConfigMap API RBAC is required.

# Ship the flag files in charts/relay-proxy/config/ and let the chart generate
# the matching retrievers — hence no `retriever:` block in the config below.
flags:
  enabled: true

relayproxy:
  config: |
    server:
      mode: http
      port: 1031
      # Separate monitoring port, scraped by VictoriaMetrics at relay-proxy:1032
      # (see deploy/values/victoria-metrics.yaml). Setting this also moves the
      # chart's liveness/readiness probes onto this port — see the chart README —
      # so the pod's readiness now depends on it being served correctly.
      monitoringPort: 1032

    # How often GOFF re-reads the mounted flag files, in ms. Deliberately short
    # (1s) so a `kubectl edit configmap relay-proxy-flags` reaches the relay's
    # own view as soon as kubelet has refreshed the mount. This is only the
    # first of two hops we control: otelnats's provider evaluates in-process and
    # polls this relay every OTEL_INSTRUMENTATION_GO_FLAGS_POLL_INTERVAL (2s in
    # this demo). Neither is the bottleneck — the kubelet's own ConfigMap sync
    # period is, measured at 53s on kind. Budget ~60s for a flip to land.
    pollingInterval: 1000

    # Fail loudly if the flag files are unreadable. This used to be true because
    # the ConfigMap was created by a later `kubectl apply -k deploy/base` and the
    # pod could legitimately start before it existed. The flags now install with
    # the chart, so the mount is populated from the pod's very first start and an
    # unreadable retriever is a real defect — one that, tolerated, produces a
    # relay proxy that is Ready and answers every evaluation with the caller's
    # default.
    startWithRetrieverError: false

    logLevel: info

    # Evaluation results are logged rather than shipped anywhere — this is a
    # local demo, and no flag-analytics backend exists in the stack.
    #
    # Expect this to stay quiet for otel-nats-tracing. otelnats evaluates
    # in-process against its polled copy of the configuration and hardcodes
    # DataCollectorDisabled, so the relay never observes those evaluations at
    # all. That is deliberate: with one evaluation per instrumented operation,
    # the analytics would be a copy of the demo's traffic volume, and a full
    # collector buffer flushes synchronously on the evaluating goroutine.
    exporter:
      kind: log

replicaCount: 1

service:
  type: ClusterIP
  port: 1031

# Modest for a single-node kind cluster (the chart's default requests 500m CPU,
# which competes with ClickHouse/Grafana on one node).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true

# No ConfigMap API Role/RoleBinding — flags come from the chart-managed mount.
extraManifests: []
