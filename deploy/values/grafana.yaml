# Local-demo values for the vendored grafana/grafana chart (charts/grafana,
# see charts/grafana/SOURCE.txt). Installs the ClickHouse datasource plugin,
# auto-provisions a ClickHouse datasource pointed at rotel's ClickHouse
# export target, and auto-provisions one dashboard for looking up a trace by
# ID. Install with:
#
#   helm install grafana charts/grafana -f deploy/values/grafana.yaml -n demo
#
# Access (default ClusterIP service, no Ingress):
#   kubectl port-forward -n demo svc/grafana 3000:3000
#   open http://localhost:3000  — anonymous Viewer (no login for dashboards)
#   admin login still available: admin / demo-grafana-admin
#
# ClickHouse connection used below MUST match deploy/values/clickhouse.yaml's
# `auth.username`/`auth.password` (documented there too):
#   host: clickhouse (the Helm release name from `helm install clickhouse ...`)
#   port: 8123 (HTTP interface — same interface rotel's exporter writes through)
#   username: default
#   password: demo-clickhouse-pw
#   database: otel / table: otel_traces (rotel's default database + table-prefix,
#     schema created by the clickhouse-ddl Job in deploy/base/rotel.yaml)
#
# This whole file (datasource jsonData, dashboard panels/queries) was verified
# against a real cluster: `helm install`ed for real, a real span pushed through
# a real rotel Deployment into a real ClickHouse, and the dashboard opened in an
# actual browser (Playwright) logged in as admin — both panels below render
# real data, including a 5-span multi-service trace (frontend -> backend ->
# relay-proxy + NATS publish/consume) rendered as a correctly-nested waterfall.
#
# One non-obvious thing found via that live test, worth recording: the "Trace
# timeline" panel's query below uses `editorType: "sql"` with a literal
# `rawSql`, NOT the query-builder's `isTraceIdMode` builder options (even
# though that's what the Grafana UI itself uses when you pick Query Type ->
# Traces -> Trace ID interactively). The ClickHouse datasource plugin's SQL
# generation from builder options (src/data/sqlGenerator.ts's
# `generateTraceIdQuery`) runs client-side only, in the browser, when a human
# edits the builder fields — it is never re-run for a dashboard JSON that
# already has `editorType: "builder"` and empty `rawSql` sitting in a
# provisioned ConfigMap (no human ever touches the builder UI for it), so the
# panel just sends an empty query and ClickHouse 400s with "Empty query".
# The `rawSql` below is what that generator produces for this exact schema
# (hand-derived from sqlGenerator.ts's `generateTraceIdQuery`, then confirmed
# byte-for-byte via `/api/ds/query` against the live datasource) — it includes
# the same `otel_traces_trace_id_ts` fast-lookup optimization the interactive
# builder would produce, given `hasTraceTimestampTable: true`.

adminUser: admin
# Plaintext demo credential, intentional for an ephemeral local `kind` cluster —
# not meant for anything resembling production use. Prefer anonymous access for
# day-to-day dashboard viewing; keep admin for edits/admin UI only.
adminPassword: "demo-grafana-admin"

# Local demo: open dashboards without a login prompt. Anonymous users get
# Viewer (read-only). Admin can still sign in for provisioning/edits.
# ref: https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/anonymous-auth/
grafana.ini:
  auth.anonymous:
    enabled: true
    org_name: Main Org.
    org_role: Viewer
    hide_version: true
  auth:
    # Skip the login page when opening Grafana; dashboards load immediately.
    disable_login_form: false
  users:
    viewers_can_edit: false

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

## Install the ClickHouse datasource plugin (not bundled with core Grafana).
## ref: https://grafana.com/grafana/plugins/grafana-clickhouse-datasource/
plugins:
  - grafana-clickhouse-datasource

## Automatic datasource provisioning (renders into a provisioning ConfigMap
## consumed by Grafana on startup — no manual "Add data source" click-through).
## ref: http://docs.grafana.org/administration/provisioning/#datasources
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: ClickHouse
        uid: clickhouse-traces
        type: grafana-clickhouse-datasource
        access: proxy
        url: clickhouse:8123
        isDefault: true
        editable: true
        jsonData:
          host: clickhouse
          port: 8123
          protocol: http
          defaultDatabase: otel
          username: default
          # Single-table trace mode tells the plugin how to map rotel's
          # (community OTel-collector-compatible) `otel_traces` table columns
          # into Grafana's native trace/span model, and lets it use the
          # `otel_traces_trace_id_ts` materialized view rotel's clickhouse-ddl
          # schema-init Job creates for fast by-ID lookups.
          configMode: single-table
          signalType: traces
          traces:
            defaultDatabase: otel
            defaultTable: otel_traces
            traceIdColumn: TraceId
            spanIdColumn: SpanId
            operationNameColumn: SpanName
            parentSpanIdColumn: ParentSpanId
            serviceNameColumn: ServiceName
            durationColumn: Duration
            durationUnit: nanoseconds
            startTimeColumn: Timestamp
            tagsColumn: SpanAttributes
            serviceTagsColumn: ResourceAttributes
            kindColumn: SpanKind
            statusCodeColumn: StatusCode
            statusMessageColumn: StatusMessage
            stateColumn: TraceState
            flattenNested: false
            traceEventsColumnPrefix: Events
            traceLinksColumnPrefix: Links
            traceTimestampTableSuffix: _trace_id_ts
            otelEnabled: false
        secureJsonData:
          password: demo-clickhouse-pw

      ## VictoriaMetrics for metrics. Grafana's built-in `prometheus` type is
      ## used deliberately: VictoriaMetrics serves the Prometheus query API, so
      ## no extra datasource plugin has to be installed (unlike the ClickHouse
      ## traces source above, which does need one).
      - name: VictoriaMetrics
        uid: victoriametrics
        type: prometheus
        access: proxy
        url: http://victoria-metrics:8428
        isDefault: false
        jsonData:
          httpMethod: POST
          # VictoriaMetrics' scrape_interval (see deploy/values/victoria-metrics.yaml)
          timeInterval: 15s

## Automatic dashboard provisioning: a file-based provider whose dashboards
## come from the `dashboards` key below (chart auto-mounts each dashboard's
## JSON directly at /var/lib/grafana/dashboards/<provider>/<key>.json, no
## sidecar container required).
## ref: http://docs.grafana.org/administration/provisioning/#dashboards
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: demo
        orgId: 1
        folder: "Trace Propagation Demo"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/demo

dashboards:
  demo:
    trace-by-id:
      json: |
        {
          "title": "Trace Propagation Demo",
          "uid": "trace-propagation-demo",
          "schemaVersion": 39,
          "version": 1,
          "editable": true,
          "timezone": "browser",
          "time": { "from": "now-24h", "to": "now" },
          "templating": {
            "list": [
              {
                "name": "trace_id",
                "type": "textbox",
                "label": "Trace ID",
                "query": "",
                "current": { "value": "", "text": "" }
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "traces",
              "title": "Trace timeline",
              "description": "Waterfall view of every span belonging to the entered Trace ID, across frontend, backend, relay-proxy and NATS producer/consumer.",
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 0 },
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
                  "pluginVersion": "",
                  "editorType": "sql",
                  "format": 3,
                  "rawSql": "WITH '$trace_id' as __gf_trace_id, (SELECT min(Start) FROM \"otel\".\"otel_traces_trace_id_ts\" WHERE TraceId = __gf_trace_id) as __gf_trace_start, (SELECT max(End) + 1 FROM \"otel\".\"otel_traces_trace_id_ts\" WHERE TraceId = __gf_trace_id) as __gf_trace_end SELECT \"TraceId\" as traceID, \"SpanId\" as spanID, \"ParentSpanId\" as parentSpanID, \"ServiceName\" as serviceName, \"SpanName\" as operationName, multiply(toUnixTimestamp64Nano(\"Timestamp\"), 0.000001) as startTime, multiply(\"Duration\", 0.000001) as duration, arrayMap(key -> map('key', key, 'value',\"SpanAttributes\"[key]), mapKeys(\"SpanAttributes\")) as tags, arrayMap(key -> map('key', key, 'value',\"ResourceAttributes\"[key]), mapKeys(\"ResourceAttributes\")) as serviceTags, if(\"StatusCode\" IN ('Error', 'STATUS_CODE_ERROR'), 2, 0) as statusCode, arrayMap((name, timestamp, attributes) -> tuple(name, toString(toUnixTimestamp64Milli(timestamp)), arrayMap(key -> map('key', key, 'value', attributes[key]), mapKeys(attributes)))::Tuple(name String, timestamp String, fields Array(Map(String, String))), \"Events\".Name, \"Events\".Timestamp, \"Events\".Attributes) AS logs, arrayMap((traceID, spanID, attributes) -> tuple(traceID, spanID, arrayMap(key -> map('key', key, 'value', attributes[key]), mapKeys(attributes)))::Tuple(traceID String, spanID String, tags Array(Map(String, String))), \"Links\".TraceId, \"Links\".SpanId, \"Links\".Attributes) AS references, \"SpanKind\" as kind, \"StatusMessage\" as statusMessage, \"TraceState\" as traceState FROM \"otel\".\"otel_traces\" WHERE traceID = __gf_trace_id AND \"Timestamp\" >= __gf_trace_start AND \"Timestamp\" <= __gf_trace_end"
                }
              ]
            },
            {
              "id": 2,
              "type": "table",
              "title": "Spans for Trace ID",
              "description": "Raw otel_traces rows for the entered Trace ID, one row per span.",
              "gridPos": { "h": 12, "w": 24, "x": 0, "y": 12 },
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
              "fieldConfig": {
                "defaults": {
                  "custom": { "align": "auto", "cellOptions": { "type": "auto" } }
                },
                "overrides": [
                  {
                    "matcher": { "id": "byName", "options": "DurationMs" },
                    "properties": [{ "id": "unit", "value": "ms" }]
                  }
                ]
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
                  "pluginVersion": "",
                  "editorType": "sql",
                  "rawSql": "SELECT Timestamp, ServiceName, SpanName, SpanKind, ParentSpanId, SpanId, Duration / 1000000 AS DurationMs, StatusCode, StatusMessage FROM otel.otel_traces WHERE TraceId = '$trace_id' ORDER BY Timestamp ASC",
                  "format": 1
                }
              ]
            },
            {
              "id": 3,
              "type": "table",
              "title": "Span-linked async spans (NATS)",
              "description": "The NATS consumer spans are NOT part of the entered trace: otelnats starts each 'process <subject>' span as its own root and attaches the producer as an OTel span LINK, which is its documented, intentional design for asynchronous messaging. The panels above therefore cannot show them. This panel follows the links instead, listing every span anywhere in ClickHouse that references the entered Trace ID. Each row's own TraceId is a separate trace you can paste back into the Trace ID variable to inspect on its own.",
              "gridPos": { "h": 10, "w": 24, "x": 0, "y": 24 },
              "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
              "fieldConfig": {
                "defaults": {
                  "custom": { "align": "auto", "cellOptions": { "type": "auto" } }
                },
                "overrides": [
                  {
                    "matcher": { "id": "byName", "options": "DurationMs" },
                    "properties": [{ "id": "unit", "value": "ms" }]
                  }
                ]
              },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "grafana-clickhouse-datasource", "uid": "clickhouse-traces" },
                  "pluginVersion": "",
                  "editorType": "sql",
                  "rawSql": "SELECT Timestamp, ServiceName, SpanName, SpanKind, TraceId AS OwnTraceId, SpanId, arrayElement(Links.TraceId, 1) AS LinkedTraceId, arrayElement(Links.SpanId, 1) AS LinkedSpanId, Duration / 1000000 AS DurationMs, StatusCode FROM otel.otel_traces WHERE has(Links.TraceId, '$trace_id') ORDER BY Timestamp ASC",
                  "format": 1
                }
              ]
            }
          ]
        }
    ecosystem-metrics:
      json: |
        {
          "uid": "ecosystem-metrics",
          "title": "Ecosystem Metrics",
          "tags": ["demo", "metrics"],
          "timezone": "browser",
          "schemaVersion": 39,
          "refresh": "10s",
          "time": { "from": "now-15m", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Scrape target health (1 = up)",
              "description": "Every component VictoriaMetrics scrapes. A target that is misconfigured shows up here as missing or 0 rather than as an error anywhere else, so this is the first panel to check.",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "min": 0, "max": 1 }, "overrides": [] },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "up",
                  "legendFormat": "{{job}}"
                }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "rotel — spans accepted/exported per second",
              "description": "The collector's own internal telemetry, pushed to VictoriaMetrics over OTLP (rotel exposes no scrape endpoint). This is the panel that shows whether a load test is actually reaching the pipeline.",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "sum by (__name__, protocol) (rate({__name__=~\"rotel_.*_total\"}[1m]))",
                  "legendFormat": "{{__name__}} {{protocol}}"
                }
              ]
            },
            {
              "id": 3,
              "type": "timeseries",
              "title": "Backend — HTTP request rate",
              "description": "From the otelhttp handler wrapping POST /api/demo-trace, exported over OTLP via rotel.",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "sum by (job) (rate(http_server_request_duration_seconds_count{job=\"\"}[1m]))",
                  "legendFormat": "{{http_route}}"
                }
              ]
            },
            {
              "id": 4,
              "type": "timeseries",
              "title": "Backend — Go runtime (goroutines & heap)",
              "description": "From go.opentelemetry.io/contrib/instrumentation/runtime. Useful for spotting whether load is costing the demo service memory or goroutine growth.",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "go_goroutine_count",
                  "legendFormat": "goroutines"
                },
                {
                  "refId": "B",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "go_memory_used_bytes",
                  "legendFormat": "heap bytes"
                }
              ]
            },
            {
              "id": 5,
              "type": "timeseries",
              "title": "NATS — messages in/out per second",
              "description": "From the prometheus-nats-exporter sidecar (nats:7777).",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "rate(nats_varz_in_msgs[1m])",
                  "legendFormat": "in"
                },
                {
                  "refId": "B",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "rate(nats_varz_out_msgs[1m])",
                  "legendFormat": "out"
                }
              ]
            },
            {
              "id": 6,
              "type": "timeseries",
              "title": "ClickHouse — query & insert activity",
              "description": "From ClickHouse's built-in Prometheus endpoint (clickhouse:8001). Insert activity here is the trace pipeline's write side.",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "sum by (__name__) (rate({__name__=~\"ClickHouseProfileEvents_(Query|AsyncInsertQuery|AsyncInsertRows|InsertedRows)\"}[1m]))",
                  "legendFormat": "{{__name__}}"
                }
              ]
            },
            {
              "id": 7,
              "type": "timeseries",
              "title": "Relay proxy — flag evaluation activity",
              "description": "From the GOFF relay proxy's monitoring port (relay-proxy:1032). Library flag evaluations (e.g. otel-nats-tracing via otelnats) may appear here; the demo does not evaluate application-level flags per request.",
              "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "targets": [
                {
                  "refId": "A",
                  "datasource": { "type": "prometheus", "uid": "victoriametrics" },
                  "expr": "sum by (__name__) (rate({__name__=~\"gofeatureflag_(flag_evaluations_total|all_flag_evaluations_total|request_duration_seconds_count)\"}[1m]))",
                  "legendFormat": "{{__name__}}"
                }
              ]
            }
          ]
        }
