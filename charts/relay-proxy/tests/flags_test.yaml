suite: test flag definition files
templates:
  - flags-configmap.yaml
  - configmap.yaml
  # deployment.yaml's checksum/configmap annotation renders configmap.yaml, so
  # every failure this suite provokes there also surfaces through it.
  - deployment.yaml
tests:
  - it: should not render the flags ConfigMap by default
    template: flags-configmap.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should not mount anything beyond the config volume by default
    template: deployment.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.volumes
          count: 1
      - lengthEqual:
          path: spec.template.spec.containers[0].volumeMounts
          count: 1

  - it: should leave the user's retriever alone by default
    template: configmap.yaml
    asserts:
      - matchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'retriever:\n\s+kind: http'

  - it: should render one ConfigMap key per file in flags.dir
    template: flags-configmap.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-relay-proxy-flags
      - isNotNull:
          path: data["otel-nats-tracing.yaml"]
      # The file's comments are part of the demo's explanation and have to reach
      # whoever runs `kubectl get configmap -o yaml`.
      - matchRegex:
          path: data["otel-nats-tracing.yaml"]
          pattern: 'otel-nats-tracing:'

  - it: should generate one file retriever per flag file
    template: configmap.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - matchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'retrievers:\n  - kind: file\n    path: /flags/otel-nats-tracing\.yaml'

  - it: should keep the operator's comments and key order in the config
    template: configmap.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        # leading comment
        server:
          port: 1031
        # trailing comment
        logLevel: info
    asserts:
      - matchRegex:
          path: data["goff-proxy.yml"]
          pattern: '# leading comment\nserver:\n  port: 1031\n# trailing comment\nlogLevel: info\nretrievers:'

  - it: should mount the flags ConfigMap read-only at flags.mountPath
    template: deployment.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: relay-proxy-flags-volume
            configMap:
              name: RELEASE-NAME-relay-proxy-flags
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: relay-proxy-flags-volume
            mountPath: /flags
            readOnly: true

  - it: should follow a custom mountPath in both the mount and the retriever
    templates:
      - deployment.yaml
      - configmap.yaml
    set:
      flags.enabled: true
      flags.mountPath: /etc/goff/flags
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: relay-proxy-flags-volume
            mountPath: /etc/goff/flags
            readOnly: true
        template: deployment.yaml
      - matchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'path: /etc/goff/flags/otel-nats-tracing\.yaml'
        template: configmap.yaml

  # The demo's central claim is that a flag flips without restarting anything.
  # A checksum annotation over the flags ConfigMap would roll the pod on every
  # `helm upgrade` that touches a flag file, so its absence is load-bearing.
  - it: should not roll the pod when a flag file changes
    template: deployment.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - isNull:
          path: spec.template.metadata.annotations["checksum/flags-configmap"]
      - isNotNull:
          path: spec.template.metadata.annotations["checksum/configmap"]

  - it: should add commonLabels to the flags ConfigMap
    template: flags-configmap.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
      commonLabels:
        custom-label: custom-value
    asserts:
      - equal:
          path: metadata.labels["custom-label"]
          value: custom-value

  - it: should ignore files that are not yaml, yml or json
    template: configmap.yaml
    set:
      flags.enabled: true
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      # The glob is what keeps a stray note file dropped into config/ out of the
      # generated retrievers.
      - notMatchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'path: /flags/.*\.(txt|md)'
