# The chart's fail-fast paths. Kept in their own suite, scoped to configmap.yaml
# alone: deployment.yaml renders configmap.yaml for its checksum annotation, so
# in a suite covering both, Helm reports the abort against deployment.yaml and
# `failedTemplate` never matches on configmap.yaml.
suite: test config and flag validation
templates:
  - configmap.yaml
tests:
  - it: should refuse to overwrite a singular retriever already in the config
    set:
      flags.enabled: true
      relayproxy.config: |
        retriever:
          kind: http
          url: https://example.com/flags.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'relayproxy\.config already defines its own retriever'

  - it: should refuse to overwrite a plural retrievers already in the config
    set:
      flags.enabled: true
      relayproxy.config: |
        retrievers:
          - kind: http
            url: https://example.com/flags.yaml
    asserts:
      - failedTemplate:
          errorPattern: 'relayproxy\.config already defines its own retriever'

  # Without this, an empty or mistyped flags.dir would render a relay proxy that
  # starts healthy and answers every evaluation with the caller's default.
  - it: should fail when flags.dir holds no flag file
    set:
      flags.enabled: true
      flags.dir: no-such-directory
      relayproxy.config: |
        server:
          port: 1031
    asserts:
      - failedTemplate:
          errorPattern: 'no flag file matches'

  - it: should reject a relayproxy.config that is not valid YAML
    set:
      relayproxy.config: |
        server:
          port: 1031
         badly: indented
    asserts:
      - failedTemplate:
          errorPattern: 'relayproxy\.config is not valid YAML'

  - it: should still allow a hand-managed retriever when flags are off
    set:
      relayproxy.config: |
        retriever:
          kind: http
          url: https://example.com/flags.yaml
    asserts:
      - matchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'retriever:\n  kind: http'
      - notMatchRegex:
          path: data["goff-proxy.yml"]
          pattern: 'retrievers:'
