{{- if .Values.ingress.enabled -}}
{{- $fullName := include "relay-proxy.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- /*
Chart.yaml pins kubeVersion to >=1.19, where networking.k8s.io/v1 and
`ingressClassName` are the only spelling. The `networking.k8s.io/v1beta1` and
`extensions/v1beta1` fallbacks upstream still carries, along with the
`kubernetes.io/ingress.class` annotation backfill, address API versions removed
in Kubernetes 1.22 and are unreachable from any supported cluster.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "relay-proxy.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ include "relay-proxy.render" (dict "value" .host "context" $) | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- /* Required by networking.k8s.io/v1, so defaulted rather than omitted. */}}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
