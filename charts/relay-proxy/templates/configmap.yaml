{{- $config := tpl .Values.relayproxy.config . }}
{{- $parsed := fromYaml $config }}
{{- if hasKey $parsed "Error" }}
{{- fail (printf "relayproxy.config is not valid YAML, so the relay proxy would fail to load it at startup: %s" $parsed.Error) }}
{{- end }}
{{- if .Values.flags.enabled }}
{{- if or (hasKey $parsed "retriever") (hasKey $parsed "retrievers") }}
{{- fail "flags.enabled is true, but relayproxy.config already defines its own retriever/retrievers and the chart will not silently overwrite it. Either remove the retriever from relayproxy.config and let the chart generate one per file in flags.dir, or set flags.enabled=false and keep managing retrievers by hand." }}
{{- end }}
{{- /*
Appended as text rather than re-marshalled from $parsed, so the comments and key
order the operator wrote in relayproxy.config survive into the ConfigMap.
*/}}
{{- $config = printf "%s\n%s\n" (regexReplaceAll "\\n+$" $config "") (include "relay-proxy.flagRetrievers" . | trimSuffix "\n") }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "relay-proxy.fullname" . }}
  labels:
    {{- include "relay-proxy.labels" . | nindent 4 }}
data:
  goff-proxy.yml: {{- toYaml $config | nindent 4 }}
