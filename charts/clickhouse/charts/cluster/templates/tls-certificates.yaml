{{- if and .Values.tls.enabled .Values.tls.createCertificates }}
{{- if not .Values.tls.issuerRef.name }}
{{- fail "tls.enabled with createCertificates requires tls.issuerRef.name" }}
{{- end }}
{{- /*
  TLS for the Altinity operator is more involved than the official operator's
  settings.tls block (secure cluster + openSSL config + cert mounts). The chart
  still mints cert-manager Certificates so secrets exist; wiring them into CHI
  / CHK (secure: yes, openSSL files, volume mounts) is left to values overrides
  — see the README "TLS" section.
*/ -}}
{{- $ns := .Release.Namespace }}
{{- $chName := include "cluster.clickhouseName" . }}
{{- $keeperName := include "cluster.keeperName" . }}
{{- $chSvc := include "cluster.clickhouseServiceName" . }}
{{- if and .Values.keeper.enabled (not .Values.tls.keeper.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $keeperName }}-keeper-tls
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: keeper-tls
  annotations:
    {{- include "cluster.argocdAnnotations" "certs" | nindent 4 }}
spec:
  secretName: {{ include "cluster.keeperTlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  # Altinity CHK services: keeper-{chk} and per-replica DNS
  dnsNames:
    - "keeper-{{ $keeperName }}.{{ $ns }}.svc"
    - "keeper-{{ $keeperName }}.{{ $ns }}.svc.cluster.local"
    - "*.keeper-{{ $keeperName }}.{{ $ns }}.svc"
    - "*.keeper-{{ $keeperName }}.{{ $ns }}.svc.cluster.local"
---
{{- end }}
{{- if and .Values.clickhouse.enabled (not .Values.tls.clickhouse.existingSecret) }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $chName }}-clickhouse-tls
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: clickhouse-tls
  annotations:
    {{- include "cluster.argocdAnnotations" "certs" | nindent 4 }}
spec:
  secretName: {{ include "cluster.clickhouseTlsSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.issuerRef.name }}
    kind: {{ .Values.tls.issuerRef.kind }}
  dnsNames:
    - "{{ $chSvc }}.{{ $ns }}.svc"
    - "{{ $chSvc }}.{{ $ns }}.svc.cluster.local"
    - "clickhouse-{{ $chName }}.{{ $ns }}.svc"
    - "clickhouse-{{ $chName }}.{{ $ns }}.svc.cluster.local"
    - "*.{{ $ns }}.svc"
    - "*.{{ $ns }}.svc.cluster.local"
{{- end }}
{{- end }}
