## Default values for the cluster subchart (Altinity CHI/CHK).
## The parent chart overrides these with the minimal-HA profile.

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# ---------------------------------------------------------------------------
# ClickHouse Keeper (ClickHouseKeeperInstallation)
# ---------------------------------------------------------------------------
keeper:
  enabled: true
  name: ""
  replicas: 3
  clusterName: cluster1
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-keeper
    tag: "26.7.1.1315"
    pullPolicy: IfNotPresent
  persistence:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  labels: {}
  annotations: {}
  ## Default scheduling: hostname topologySpreadConstraints (maxSkew 1,
  ## DoNotSchedule). Multi-node: keeper pods spread evenly (skew <= 1).
  ## Single-node (kind): one topology domain, skew always 0 — still schedules.
  ## No podAntiAffinity is emitted by default.
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
    ## Honor: untolerated tainted nodes (e.g. kind control-plane) are excluded
    ## from skew calculation instead of counting as forever-empty domains that
    ## would leave pods Pending. Needs Kubernetes >= 1.26.
    nodeTaintsPolicy: Honor
  ## Opt-in soft (preferred) hostname podAntiAffinity — off by default.
  antiAffinity: false
  ## Opt-in hard operator podDistribution (Pending if nodes < replicas).
  antiAffinityRequired: false
  podTemplate:
    topologyZoneKey: ""
    nodeHostnameKey: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  settings: {}

# ---------------------------------------------------------------------------
# ClickHouse server (ClickHouseInstallation)
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  name: ""
  replicas: 2
  shards: 1
  clusterName: default
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-server
    tag: "26.7.1.1315"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
    volumeName: clickhouse-data
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  labels: {}
  annotations: {}
  ## Default scheduling: hostname topologySpreadConstraints (maxSkew 1,
  ## DoNotSchedule). Multi-node: ClickHouse pods spread evenly (skew <= 1).
  ## Single-node (kind): one topology domain, skew always 0 — still schedules.
  ## No podAntiAffinity is emitted by default.
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
    ## Honor: untolerated tainted nodes (e.g. kind control-plane) are excluded
    ## from skew calculation instead of counting as forever-empty domains that
    ## would leave pods Pending. Needs Kubernetes >= 1.26.
    nodeTaintsPolicy: Honor
  ## Opt-in soft (preferred) hostname podAntiAffinity — off by default.
  antiAffinity: false
  ## Opt-in hard operator podDistribution (Pending if nodes < replicas).
  antiAffinityRequired: false
  antiAffinityScope: ClickHouseInstallation
  podTemplate:
    topologyZoneKey: ""
    nodeHostnameKey: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    volumes: []
  ## Same Secret for defaultUser, clusterSecret, and reporter (distinct keys).
  ##   kubectl create secret generic clickhouse-default-user \
  ##     --from-literal=password='<sql-password>' \
  ##     --from-literal=secret='<cluster-secret>' \
  ##     --from-literal=reporter='<reporter-password>' -n <namespace>
  defaultUser:
    existingSecret: clickhouse-default-user
    existingSecretKey: password
  keeperClusterRef:
    name: ""
    namespace: ""
    serviceType: ""
  keeper:
    host: ""
    port: 2181
  clusterSecret:
    enabled: true
    secure: false
    auto: false
    value: ""
    valueFrom:
      secretKeyRef:
        name: clickhouse-default-user
        key: secret
  settings:
    extraConfig: {}
    extraUsersConfig:
      profiles:
        readonly:
          readonly: 2
          max_execution_time: 600
          max_result_rows: 1000000
          max_sessions_for_user: 8
      users:
        reporter:
          passwordSecret:
            name: clickhouse-default-user
            key: reporter
          profile: readonly
          networks:
            ip: "::/0"
          grants:
            query:
              - GRANT SELECT ON otel.*
  additionalPorts: []
  containerTemplate:
    env: []
    volumeMounts: []
  service:
    enabled: true
    name: ""
    annotations: {}
    sessionAffinity: ""

# ---------------------------------------------------------------------------
# Rotel
# ---------------------------------------------------------------------------
rotel:
  enabled: false
  name: ""
  replicas: 2
  ## Default scheduling: hostname topologySpreadConstraints (maxSkew 1,
  ## DoNotSchedule) — same semantics as clickhouse/keeper. No podAntiAffinity
  ## by default.
  topologySpread:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
    ## Honor: untolerated tainted nodes (e.g. kind control-plane) are excluded
    ## from skew calculation instead of counting as forever-empty domains that
    ## would leave pods Pending. Needs Kubernetes >= 1.26.
    nodeTaintsPolicy: Honor
  ## Extra verbatim topologySpreadConstraints appended after the built-in one.
  topologySpreadConstraints: []
  ## Opt-in soft (preferred) hostname podAntiAffinity — off by default.
  antiAffinity: false
  image:
    registry: docker.io
    repository: streamfold/rotel
    tag: "v0.2.2"
    pullPolicy: IfNotPresent
  ddlImage:
    registry: docker.io
    repository: streamfold/rotel-clickhouse-ddl
    tag: "v0.2.2"
    pullPolicy: IfNotPresent
  createSchema: true
  manageTtl: true
  telemetry:
    traces: true
    logs: true
    metrics: false
  logFormat: json
  internalMetrics:
    enabled: false
    endpoint: ""
  exporter:
    endpoint: ""
    database: otel
    tablePrefix: otel
    traces:
      tablePrefix: ""
    logs:
      tablePrefix: ""
    metrics:
      tablePrefix: ""
    ## Same SQL account as clickhouse.defaultUser. Empty existingSecret
    ## follows that Secret; do not point this at key `secret`.
    user: default
    existingSecret: ""
    existingSecretKey: password
    compression: lz4
    asyncInsert: true
    enableJson: false
    engine: MergeTree
    cluster: ""
    databaseEngine: Replicated
    databaseReplicaPath: ""
    ttl: 168h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraArgs: []
  extraEnv: []
  jobs:
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
