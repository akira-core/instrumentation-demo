## Default values for the cluster subchart (Altinity CHI/CHK).
## The parent chart overrides these with the minimal-HA profile.

nameOverride: ""
fullnameOverride: ""
commonLabels: {}

# ---------------------------------------------------------------------------
# ClickHouse Keeper (ClickHouseKeeperInstallation)
# ---------------------------------------------------------------------------
keeper:
  enabled: true
  name: ""
  replicas: 3
  clusterName: cluster1
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-keeper
    tag: "26.7.1.1315"
    pullPolicy: IfNotPresent
  persistence:
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  labels: {}
  annotations: {}
  antiAffinity: false
  podTemplate:
    topologyZoneKey: ""
    nodeHostnameKey: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
  settings: {}

# ---------------------------------------------------------------------------
# ClickHouse server (ClickHouseInstallation)
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  name: ""
  replicas: 2
  shards: 1
  clusterName: default
  image:
    registry: docker.io
    repository: clickhouse/clickhouse-server
    tag: "26.7.1.1315"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    annotations: {}
    volumeName: clickhouse-data
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  labels: {}
  annotations: {}
  antiAffinity: false
  antiAffinityScope: ClickHouseInstallation
  podTemplate:
    topologyZoneKey: ""
    nodeHostnameKey: ""
    nodeSelector: {}
    tolerations: []
    affinity: {}
    topologySpreadConstraints: []
    volumes: []
  ## Password for the `default` user comes from a pre-created Secret:
  ##   kubectl create secret generic clickhouse-default-user \
  ##     --from-literal=password='<your-password>' -n <namespace>
  defaultUser:
    existingSecret: clickhouse-default-user
    existingSecretKey: password
  keeperClusterRef:
    name: ""
    namespace: ""
    serviceType: ""
  keeper:
    host: ""
    port: 2181
  clusterSecret:
    enabled: true
    secure: false
    auto: true
    value: ""
    valueFrom:
      secretKeyRef:
        name: ""
        key: secret
  settings:
    extraConfig: {}
    extraUsersConfig: {}
  additionalPorts: []
  containerTemplate:
    env: []
    volumeMounts: []
  service:
    enabled: true
    name: ""
    annotations: {}
    sessionAffinity: ""

# ---------------------------------------------------------------------------
# Rotel
# ---------------------------------------------------------------------------
rotel:
  enabled: false
  name: ""
  replicas: 1
  image:
    registry: docker.io
    repository: streamfold/rotel
    tag: "v0.2.2"
    pullPolicy: IfNotPresent
  ddlImage:
    registry: docker.io
    repository: streamfold/rotel-clickhouse-ddl
    tag: "v0.2.2"
    pullPolicy: IfNotPresent
  createSchema: true
  manageTtl: true
  telemetry:
    traces: true
    logs: true
    metrics: false
  logFormat: json
  internalMetrics:
    enabled: false
    endpoint: ""
  exporter:
    endpoint: ""
    database: otel
    tablePrefix: otel
    traces:
      tablePrefix: ""
    logs:
      tablePrefix: ""
    metrics:
      tablePrefix: ""
    user: default
    existingSecret: ""
    existingSecretKey: password
    compression: lz4
    asyncInsert: true
    enableJson: false
    engine: MergeTree
    cluster: ""
    databaseEngine: Replicated
    databaseReplicaPath: ""
    ttl: 168h
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    annotations: {}
  podLabels: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraArgs: []
  extraEnv: []
  jobs:
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
