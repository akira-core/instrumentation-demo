apiVersion: v2
name: clickhouse
description: >
  All-in-one Helm chart for ClickHouse on Kubernetes. Bundles the Altinity
  ClickHouse Operator and a local cluster subchart that deploys a
  ClickHouseKeeperInstallation plus a replicated ClickHouseInstallation
  (minimal HA: 3 Keeper nodes, 1 shard x 2 replicas).
type: application
version: 0.3.0
appVersion: "26.7.1.1315"
kubeVersion: ">= 1.25.0-0"
home: https://github.com/Altinity/clickhouse-operator
keywords:
  - clickhouse
  - clickhouse-keeper
  - operator
  - altinity
  - analytics
  - olap
sources:
  - https://github.com/Altinity/clickhouse-operator
  - https://github.com/Altinity/clickhouse-operator/blob/master/docs/quick_start.md

dependencies:
  # Altinity ClickHouse Operator, vendored locally for offline installs.
  # Upstream source: https://helm.altinity.com
  # Refresh with:
  #   rm -rf charts/altinity-clickhouse-operator
  #   helm pull altinity/altinity-clickhouse-operator \
  #     --version <new> --untar --untardir charts/
  - name: altinity-clickhouse-operator
    version: "0.27.3"
    repository: "file://charts/altinity-clickhouse-operator"
    alias: operator
    condition: operator.enabled

  # Local subchart: CHK + CHI custom resources, Rotel OTLP collector,
  # schema/TTL Jobs
  - name: cluster
    version: "0.3.0"
    repository: "file://charts/cluster"
    condition: cluster.enabled
