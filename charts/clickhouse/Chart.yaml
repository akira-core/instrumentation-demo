apiVersion: v2
name: clickhouse
description: >
  Production-oriented all-in-one Helm chart for ClickHouse on Kubernetes.
  Bundles the Altinity ClickHouse Operator and a local cluster subchart that
  deploys ClickHouseKeeperInstallation + a replicated ClickHouseInstallation
  (small-business size).
type: application
version: 0.2.0
appVersion: "26.7.1.1315"
kubeVersion: ">= 1.25.0-0"
home: https://github.com/Altinity/clickhouse-operator
keywords:
  - clickhouse
  - clickhouse-keeper
  - operator
  - altinity
  - analytics
  - olap
maintainers:
  - name: altinity
sources:
  - https://github.com/Altinity/clickhouse-operator
  - https://github.com/Altinity/clickhouse-operator/blob/master/docs/quick_start.md
  - https://github.com/Altinity/helm-charts/tree/main/charts/clickhouse
annotations:
  # Uses the Altinity operator (CHI/CHK CRDs: clickhouse.altinity.com/v1 and
  # clickhouse-keeper.altinity.com/v1). Sizing and production patterns keep the
  # small-business HA profile from the previous official-operator chart.
  artifacthub.io/operator: "true"
  artifacthub.io/category: database
  artifacthub.io/links: |
    - name: Altinity Operator Quick Start
      url: https://github.com/Altinity/clickhouse-operator/blob/master/docs/quick_start.md
    - name: Altinity Operator Docs
      url: https://docs.altinity.com/altinitykubernetesoperator/
    - name: Altinity Helm Chart (reference)
      url: https://github.com/Altinity/helm-charts/tree/main/charts/clickhouse

dependencies:
  # Altinity ClickHouse Operator, vendored locally for offline/air-gapped
  # installs. Upstream source: https://helm.altinity.com
  # Refresh with:
  #   rm -rf charts/altinity-clickhouse-operator
  #   helm pull altinity/altinity-clickhouse-operator \
  #     --version <new> --untar --untardir charts/
  #   # or: helm pull from deploy/helm/clickhouse-operator in the operator repo
  - name: altinity-clickhouse-operator
    version: "0.27.2"
    repository: "file://charts/altinity-clickhouse-operator"
    alias: operator
    condition: operator.enabled

  # Local subchart: CHK + CHI CRs, Rotel, schema/TTL Jobs
  - name: cluster
    version: "0.2.0"
    repository: "file://charts/cluster"
    condition: cluster.enabled
