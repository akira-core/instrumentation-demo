# =============================================================================
# clickhouse — minimal HA defaults
# =============================================================================
# Topology (default):
#   - Altinity ClickHouse Operator (namespace-scoped watch)
#   - ClickHouse Keeper (CHK): 3 nodes (smallest quorum)
#   - ClickHouse (CHI): 1 shard × 2 replicas (smallest replicated HA)
#   - Storage: 20Gi data / 5Gi keeper per pod
#   - Resources sized to fit a single-node cluster (e.g. Docker Desktop /
#     kind with ~8 CPU / 16Gi). Raise them for real workloads.
#
# Single shard is deliberate: every replica holds the full dataset, so a query
# against any node is complete. Sharding needs a Distributed table in front of
# the otel_* tables — the rotel DDL tool does not create one, so raising
# `shards` on its own silently returns one shard's worth of rows. See
# "Scaling" in the README before changing it.
#
# Prerequisites:
#   - Kubernetes >= 1.25
#   - A default StorageClass (or set storageClassName below)
#   - A Secret with three distinct keys (see README):
#       kubectl create secret generic clickhouse-default-user \
#         --from-literal=password='<sql-password>' \
#         --from-literal=secret='<cluster-secret>' \
#         --from-literal=reporter='<reporter-password>' -n <namespace>
#
# Quick start (upstream): https://github.com/Altinity/clickhouse-operator/blob/master/docs/quick_start.md
# =============================================================================

# -----------------------------------------------------------------------------
# Altinity ClickHouse Operator (subchart alias: operator)
# Chart: altinity/altinity-clickhouse-operator (vendored)
# Docs:  https://github.com/Altinity/clickhouse-operator/blob/master/docs/quick_start.md
# -----------------------------------------------------------------------------
operator:
  enabled: true

  ## Empty = watch the operator's own namespace (when not in kube-system).
  ## Use [".*"] for all namespaces. Entries are regexps.
  watchNamespaces: []

  ## Operator Deployment
  operator:
    image:
      registry: ""
      repository: altinity/clickhouse-operator
      ## Empty tag falls back to the subchart appVersion (0.27.3)
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

  ## Metrics exporter sidecar
  metrics:
    enabled: true
    image:
      registry: ""
      repository: altinity/metrics-exporter
      tag: ""
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

  ## Namespace-scoped Role/RoleBinding instead of ClusterRole. The operator then
  ## only reaches resources in its own namespace — install CHI/CHK there too.
  rbac:
    create: true
    namespaceScoped: true

  serviceAccount:
    create: true

  ## CRDs install via pre-install/pre-upgrade hooks (needs cluster-admin once)
  crdHook:
    enabled: true

  ## Optional Grafana dashboards ConfigMaps
  dashboards:
    enabled: false

  serviceMonitor:
    enabled: false

  ## Scheduling for the operator Pod
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Cluster subchart — CHK + CHI CRs
# -----------------------------------------------------------------------------
cluster:
  enabled: true

  ## Naming. Everything defaults to <release>-cluster.
  ## nameOverride is install-time only (selector labels). fullnameOverride is safer.
  nameOverride: ""
  fullnameOverride: ""

  commonLabels:
    app.kubernetes.io/part-of: clickhouse

  # ---- ClickHouse Keeper (CHK) ----------------------------------------------
  keeper:
    enabled: true
    ## 3 = smallest quorum that survives one node loss. Do not change after
    ## the first successful deploy.
    replicas: 3
    ## Internal cluster name inside the CHK (configuration.clusters[].name)
    clusterName: cluster1
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-keeper
      tag: "26.7.1.1315"
      pullPolicy: IfNotPresent
    persistence:
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 5Gi
      annotations: {}
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    labels: {}
    annotations: {}

    ## Default scheduling: hostname topologySpreadConstraints (maxSkew 1,
    ## DoNotSchedule). Multi-node: keeper pods spread evenly (skew <= 1).
    ## Single-node (kind): one topology domain, skew always 0 — still
    ## schedules. No podAntiAffinity is emitted by default.
    topologySpread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
      ## Honor: untolerated tainted nodes (e.g. kind control-plane) are
      ## excluded from skew calculation instead of counting as forever-empty
      ## domains that would leave pods Pending. Needs Kubernetes >= 1.26.
      nodeTaintsPolicy: Honor
    ## Opt-in soft (preferred) hostname podAntiAffinity — off by default.
    antiAffinity: false
    ## Opt-in hard operator podDistribution: MaxNumberPerNode (will not
    ## schedule if nodes < replicas).
    antiAffinityRequired: false
    podTemplate:
      topologyZoneKey: ""
      nodeHostnameKey: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []

    ## Keeper settings (slash paths or nested maps — nested is flattened).
    ## Empty uses chart defaults (logger, 4LW allow-list, prometheus :7000).
    settings: {}

  # ---- ClickHouse servers (CHI) ---------------------------------------------
  clickhouse:
    enabled: true
    ## 2 = smallest replicated HA (each replica holds the full dataset).
    replicas: 2
    shards: 1
    ## remote_servers cluster name — must match rotel.exporter.cluster for
    ## ReplicatedMergeTree / Replicated database engine.
    clusterName: default
    image:
      registry: docker.io
      repository: clickhouse/clickhouse-server
      tag: "26.7.1.1315"
      pullPolicy: IfNotPresent
    persistence:
      ## Chart always emits a data volumeClaimTemplate when true
      enabled: true
      storageClassName: ""
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      annotations: {}
      ## Name of the volumeClaimTemplate (also the volumeMount name)
      volumeName: clickhouse-data
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi

    labels: {}
    annotations: {}

    ## Default scheduling: hostname topologySpreadConstraints (maxSkew 1,
    ## DoNotSchedule). Multi-node: ClickHouse pods spread evenly (skew <= 1).
    ## Single-node (kind): one topology domain, skew always 0 — still
    ## schedules. No podAntiAffinity is emitted by default.
    topologySpread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
      ## Honor: untolerated tainted nodes (e.g. kind control-plane) are
      ## excluded from skew calculation instead of counting as forever-empty
      ## domains that would leave pods Pending. Needs Kubernetes >= 1.26.
      nodeTaintsPolicy: Honor
    ## Opt-in soft (preferred) hostname podAntiAffinity — off by default.
    antiAffinity: false
    ## Opt-in hard operator podDistribution: ClickHouseAntiAffinity (Pending
    ## if nodes < replicas).
    antiAffinityRequired: false
    antiAffinityScope: ClickHouseInstallation
    podTemplate:
      topologyZoneKey: ""
      nodeHostnameKey: ""
      nodeSelector: {}
      tolerations: []
      affinity: {}
      topologySpreadConstraints: []
      volumes: []

    ## Pre-created Secret (see README). Same object, three distinct keys:
    ##   password — SQL `default` user (rotel writes with this)
    ##   secret   — inter-replica clusterSecret
    ##   reporter — SQL `reporter` user (read-only SELECT)
    ##   kubectl create secret generic clickhouse-default-user \
    ##     --from-literal=password='<sql-password>' \
    ##     --from-literal=secret='<cluster-secret>' \
    ##     --from-literal=reporter='<reporter-password>' -n <namespace>
    defaultUser:
      existingSecret: clickhouse-default-user
      existingSecretKey: password

    ## Reference to CHK. Auto-wired when keeper.enabled and name empty.
    keeperClusterRef:
      name: ""
      ## Optional: CHK in another namespace
      namespace: ""
      ## replicas (default) | service
      serviceType: ""
    ## Explicit keeper host overrides keeperClusterRef (e.g. external ensemble)
    keeper:
      host: ""
      port: 2181

    ## Inter-replica cluster secret. Defaults to the same Secret as
    ## defaultUser, key `secret` — not the SQL password.
    clusterSecret:
      enabled: true
      secure: false
      auto: false
      value: ""
      valueFrom:
        secretKeyRef:
          name: clickhouse-default-user
          key: secret

    settings:
      extraConfig:
        max_concurrent_queries: 100
        max_server_memory_usage_to_ram_ratio: 0.9
        background_pool_size: 16
        background_merges_mutations_concurrency_ratio: 2
        mark_cache_size: 536870912
        uncompressed_cache_size: 1073741824
        logger:
          level: information
          console: 1
      ## Read-only `reporter` for Grafana / BI. Password is key `reporter` on
      ## the same Secret as defaultUser (not key `password`).
      extraUsersConfig:
        profiles:
          readonly:
            # 2, not 1: Grafana's ClickHouse plugin sets session settings
            # (max_execution_time) which readonly=1 rejects.
            readonly: 2
            max_execution_time: 600
            max_result_rows: 1000000
            max_sessions_for_user: 8
        users:
          reporter:
            passwordSecret:
              name: clickhouse-default-user
              key: reporter
            profile: readonly
            networks:
              ip: "::/0"
            grants:
              query:
                - GRANT SELECT ON otel.*

    ## Extra env for ClickHouse containers
    containerTemplate:
      env: []

    additionalPorts: []

    ## Client ClusterIP Service (CHI serviceTemplate). Prefer this over the
    ## operator's default service for in-cluster Grafana / BI clients.
    service:
      enabled: true
      name: ""
      annotations: {}
      sessionAffinity: ""

  # ---- Rotel OTLP collector -------------------------------------------------
  rotel:
    enabled: true
    replicas: 2
    ## Default scheduling: hostname topologySpreadConstraints between rotel
    ## pods (same semantics as clickhouse/keeper). No podAntiAffinity by
    ## default; antiAffinity: true opts back into the soft preferred variant.
    topologySpread:
      enabled: true
      maxSkew: 1
      whenUnsatisfiable: DoNotSchedule
      ## Honor: untolerated tainted nodes (e.g. kind control-plane) are
      ## excluded from skew calculation instead of counting as forever-empty
      ## domains that would leave pods Pending. Needs Kubernetes >= 1.26.
      nodeTaintsPolicy: Honor
    antiAffinity: false
    image:
      registry: docker.io
      repository: streamfold/rotel
      tag: "v0.2.2"
      pullPolicy: IfNotPresent
    ddlImage:
      registry: docker.io
      repository: streamfold/rotel-clickhouse-ddl
      tag: "v0.2.2"
      pullPolicy: IfNotPresent
    telemetry:
      traces: true
      logs: true
      metrics: false
    logFormat: json
    internalMetrics:
      enabled: false
      endpoint: ""
    podLabels: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    jobs:
      podLabels: {}
      podAnnotations: {}
      nodeSelector: {}
      tolerations: []
      affinity: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    exporter:
      engine: ReplicatedMergeTree
      ## Must match clickhouse.clusterName
      cluster: default
      databaseEngine: Replicated
      ttl: 168h
      ## Same SQL account as clickhouse.defaultUser. Empty existingSecret
      ## follows defaultUser.existingSecret (key `password`, not `secret`).
      user: default
      existingSecret: ""
      existingSecretKey: password
